<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CHIP-8 Emulator</title>
  <style>
    body {
      background: #111; color: #eee; font-family: system-ui, sans-serif;
      display: flex; flex-direction: column; align-items: center;
      gap: 14px; margin: 0; padding: 24px;
    }
    canvas { image-rendering: pixelated; border: 2px solid #444; max-width: 100%; }
    .controls { display: flex; gap: 16px; flex-wrap: wrap; align-items: center; justify-content: center; }
    .hint { color: #aaa; font-size: 14px; margin: 0; }
  </style>
</head>
<body>
  <h1>CHIP-8 Emulator</h1>

  <div class="controls">
    <label>Game:
      <select id="rom">
        <option value="/roms/1dcell.ch8" data-hint="">1D Cellular Automata</option>
        <option value="/roms/8ceattourny_d1.ch8" data-hint="">8CE Attourny - Disc 1</option>
        <option value="/roms/8ceattourny_d2.ch8" data-hint="">8CE Attourny - Disc 2</option>
        <option value="/roms/8ceattourny_d3.ch8" data-hint="">8CE Attourny - Disc 3</option>
        <option value="/roms/BadKaiJuJu.ch8" data-hint="">Bad Kaiju Ju</option>
        <option value="/roms/RPS.ch8" data-hint="">RPS</option>
        <option value="/roms/br8kout.ch8" data-hint="">Br8kout</option>
        <option value="/roms/carbon8.ch8" data-hint="">Carbon8</option>
        <option value="/roms/caveexplorer.ch8" data-hint="">Cave Explorer</option>
        <option value="/roms/chipquarium.ch8" data-hint="">Chipquarium</option>
        <option value="/roms/chipwar.ch8" data-hint="">ChipWar</option>
        <option value="/roms/danm8ku.ch8" data-hint="">Danm8ku</option>
        <option value="/roms/dinorun.ch8" data-hint="">Dino Run</option>
        <option value="/roms/down8.ch8" data-hint="">down8</option>
        <option value="/roms/flightrunner.ch8" data-hint="">Flight Runner</option>
        <option value="/roms/fuse.ch8" data-hint="">Fuse</option>
        <option value="/roms/ghostEscape.ch8" data-hint="">Ghost Escape</option>
        <option value="/roms/glitchGhost.ch8" data-hint="">Glitch Ghost</option>
        <option value="/roms/horseWorldOnline.ch8" data-hint="">Horse World Online</option>
        <option value="/roms/knumberknower.ch8" data-hint="">Knumber Knower</option>
        <option value="/roms/masquer8.ch8" data-hint="">Masquer8</option>
        <option value="/roms/mastermind.ch8" data-hint="">Mastermind</option>
        <option value="/roms/mato8.ch8" data-hint="">Mato8</option>
        <option value="/roms/mini-lights-out.ch8" data-hint="">Mini Lights Out</option>
        <option value="/roms/octoachip8story.ch8" data-hint="">Octo: a Chip 8 Story</option>
        <option value="/roms/octojam10title.ch8" data-hint="">Octojam 10 Title</option>
        <option value="/roms/octojam1title.ch8" data-hint="">Octojam 1 Title</option>
        <option value="/roms/octojam2title.ch8" data-hint="">Octojam 2 Title</option>
        <option value="/roms/octojam3title.ch8" data-hint="">Octojam 3 Title</option>
        <option value="/roms/octojam4title.ch8" data-hint="">Octojam 4 Title</option>
        <option value="/roms/octojam5title.ch8" data-hint="">Octojam 5 Title</option>
        <option value="/roms/octojam6title.ch8" data-hint="">Octojam 6 Title</option>
        <option value="/roms/octojam7title.ch8" data-hint="">Octojam 7 Title</option>
        <option value="/roms/octojam8title.ch8" data-hint="">Octojam 8 Title</option>
        <option value="/roms/octojam9title.ch8" data-hint="">Octojam 9 Title</option>
        <option value="/roms/octorancher.ch8" data-hint="">Octo Rancher</option>
        <option value="/roms/outlaw.ch8" data-hint="">Outlaw</option>
        <option value="/roms/petdog.ch8" data-hint="">Pet Dog</option>
        <option value="/roms/piper.ch8" data-hint="">Piper</option>
        <option value="/roms/pumpkindressup.ch8" data-hint="">Pumpkin &quot;Dreess&quot; Up</option>
        <option value="/roms/slipperyslope.ch8" data-hint="">Slippery Slope</option>
        <option value="/roms/snek.ch8" data-hint="">Snek</option>
        <option value="/roms/spacejam.ch8" data-hint="">Spacejam!</option>
        <option value="/roms/spaceracer.ch8" data-hint="">Space Racer</option>
        <option value="/roms/spockpaperscissors.ch8" data-hint="">Spock Paper Scissors</option>
        <option value="/roms/superpong.ch8" data-hint="">Super Pong</option>
        <option value="/roms/tank.ch8" data-hint="">Tank!</option>
        <option value="/roms/tick.ch8" data-hint="">Tick</option>
        <option value="/roms/tombstontipp.ch8" data-hint="">TOMB STON TIPP</option>
        <option value="/roms/wdl.ch8" data-hint="">WDL</option>

      </select>
    </label>
    <label><input type="checkbox" id="classic"> Classic quirks</label>
    <label>Your own ROM: <input type="file" id="upload" accept=".ch8"></label>
  </div>

  <p class="hint" id="hint">Move: W A S D · Shoot: E</p>
  <canvas id="canvas" oncontextmenu="event.preventDefault()"></canvas>
  <p class="hint">Keypad: 1234 / QWER / ASDF / ZXCV · Backspace restarts · Click the game for sound</p>

  <script>
    var Module = { canvas: document.getElementById('canvas') };

    const romSelect = document.getElementById('rom');
    const classicBox = document.getElementById('classic');
    const hint = document.getElementById('hint');
    let currentRom = romSelect.value;

    function startGame(path) {
      currentRom = path;
      Module.ccall('loadGame', null, ['string', 'number'],
                   [path, classicBox.checked ? 1 : 0]);
    }

    romSelect.addEventListener('change', () => {
      hint.textContent = romSelect.selectedOptions[0].dataset.hint || '';
      startGame(romSelect.value);
      romSelect.blur();
    });

    classicBox.addEventListener('change', () => {
      startGame(currentRom);
      classicBox.blur();
    });

    document.getElementById('upload').addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const bytes = new Uint8Array(await file.arrayBuffer());
      Module.FS.writeFile('/roms/upload.ch8', bytes);
      hint.textContent = 'Playing your ROM: ' + file.name;
      startGame('/roms/upload.ch8');
      e.target.blur();
    });
  </script>
  {{{ SCRIPT }}}
</body>
</html>
